<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="description" content="The Living Table card-driven online battle board MVP.">
  <meta name="build" content="full-card-modal-20260804">
  <title>The Living Table — Battle Board MVP</title>
  <link rel="stylesheet" href="styles.css?v=full-card-modal-1">
  <link rel="stylesheet" href="player-board.css?v=full-card-modal-1">
  <link rel="stylesheet" href="compact-stacks.css?v=full-card-modal-1">
  <link rel="stylesheet" href="card-modal.css?v=full-card-modal-1">

  <style>
    #app .fixed-board{display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;grid-template-columns:none!important;grid-auto-flow:initial!important;align-items:stretch!important;gap:10px!important;width:100%!important;min-width:0!important;overflow-x:auto!important;overflow-y:hidden!important;padding:4px 4px 14px!important}
    #app .fixed-board>section.board-slot[data-slot]{display:flex!important;flex:0 0 176px!important;flex-direction:column!important;width:176px!important;min-width:176px!important;max-width:176px!important;grid-column:auto!important;grid-row:auto!important;margin:0!important}
    .read-aloud-copy{padding:12px;border-left:3px solid #d9b45f;background:#17150f;font-size:1.05rem;line-height:1.55}
    .item-uses{margin-top:10px;padding:8px;border:1px solid #6c5931;border-radius:8px;background:#17150f;text-align:center}
    @media(max-width:900px){#app .fixed-board>section.board-slot[data-slot]{flex-basis:164px!important;width:164px!important;min-width:164px!important;max-width:164px!important}}
  </style>
</head>

  <a class="skip" href="#board">Skip to battle board</a>
  <div id="app"></div>
  <script type="module" src="src/app.js?v=full-card-modal-1"></script>
