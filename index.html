<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="description" content="The Living Table card-driven online battle board MVP.">
  <meta name="build" content="tabletop-polish-20260804">
  <title>The Living Table — Battle Board MVP</title>
  <link rel="stylesheet" href="styles.css?v=tabletop-polish-1">
  <link rel="stylesheet" href="player-board.css?v=tabletop-polish-1">
  <link rel="stylesheet" href="compact-stacks.css?v=tabletop-polish-1">
  <link rel="stylesheet" href="card-modal.css?v=tabletop-polish-1">
  <link rel="stylesheet" href="workspace-polish.css?v=tabletop-polish-1">
  <style>
    #app .fixed-board{
      display:flex!important;
      flex-direction:row!important;
      flex-wrap:nowrap!important;
      grid-template-columns:none!important;
      grid-auto-flow:initial!important;
      align-items:stretch!important;
      gap:10px!important;
      width:100%!important;
      min-width:0!important;
      overflow-x:auto!important;
      overflow-y:hidden!important;
      padding:4px 4px 14px!important;
    }
    #app .fixed-board>section.board-slot[data-slot]{
      display:flex!important;
      flex:0 0 176px!important;
      flex-direction:column!important;
      width:176px!important;
      min-width:176px!important;
      max-width:176px!important;
      grid-column:auto!important;
      grid-row:auto!important;
      margin:0!important;
    }
    @media(max-width:900px){
      #app .fixed-board>section.board-slot[data-slot]{
        flex-basis:164px!important;
        width:164px!important;
        min-width:164px!important;
        max-width:164px!important;
      }
    }
  </style>
</head>
<body>
  <a class="skip" href="#board">Skip to battle board</a>
  <div id="app"></div>
  <script type="module" src="src/app.js?v=tabletop-polish-1"></script>
  <script defer src="card-modal.js?v=tabletop-polish-1"></script>
  <script defer src="workspace-controls.js?v=tabletop-polish-1"></script>
</body>
</html>
